<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#1D3842]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Board Game Helper - Jouer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        function handleSpriteError(imgElem) {
            imgElem.style.display = 'none';
            const fallbackElem = imgElem.nextElementSibling;
            if (fallbackElem && fallbackElem.classList.contains('fallback-cross')) {
                fallbackElem.classList.remove('hidden');
                fallbackElem.classList.add('flex');
            }
        }

        const COLOR_OPTIONS = [
            { id: 'purple', name: 'Violet', category: 'taille', icon: 'fa-ruler-combined', bgClass: 'bg-purple-600', borderClass: 'border-purple-500', sprite: 'BLAB.svg' },
            { id: 'blue', name: 'Bleu', category: 'titre', icon: 'fa-heading', bgClass: 'bg-blue-600', borderClass: 'border-blue-500', sprite: 'BLEB.svg' },
            { id: 'green', name: 'Vert', category: 'auteur', icon: 'fa-user-pen', bgClass: 'bg-emerald-600', borderClass: 'border-emerald-500', sprite: 'BLIB.svg' },
            { id: 'red', name: 'Rouge', category: 'date', icon: 'fa-calendar-days', bgClass: 'bg-red-600', borderClass: 'border-red-500', sprite: 'BLOB.svg' },
            { id: 'yellow', name: 'Jaune', category: 'technique', icon: 'fa-gears', bgClass: 'bg-amber-500', borderClass: 'border-amber-400', sprite: 'BLUB.svg' }
        ];

        const MULTICOLOR_TILE = {
            id: 'multicolor',
            name: 'Multicouleur',
            category: 'révision',
            icon: 'fa-shapes',
            bgClass: 'bg-gradient-to-br from-purple-700 via-emerald-600 to-amber-500',
            borderClass: 'border-amber-300',
            isMulticolor: true
        };

        const ARTWORKS_DB = [
            { title: "La Cène", image: "la-cene.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Léonard de Vinci" }, date: { question: "Date (Année) :", correct: "1498" }, taille: { question: "Taille (arrondi au cm) :", correct: "460 x 880 cm" }, technique: { question: "Technique :", correct: "Peinture murale (tempera et huile sur plâtre)" } },
            { title: "La Joconde", image: "la-joconde.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Léonard de Vinci" }, date: { question: "Date (Année) :", correct: "1503" }, taille: { question: "Taille (arrondi au cm) :", correct: "77 x 53 cm" }, technique: { question: "Technique :", correct: "Huile sur panneau de peuplier" } },
            { title: "La Ronde de nuit", image: "la-ronde-de-nuit.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Rembrandt" }, date: { question: "Date (Année) :", correct: "1642" }, taille: { question: "Taille (arrondi au cm) :", correct: "379 x 454 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } },
            { title: "La Jeune Fille à la perle", image: "la-jeune-fille-a-la-perle.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Johannes Vermeer" }, date: { question: "Date (Année) :", correct: "1665" }, taille: { question: "Taille (arrondi au cm) :", correct: "45 x 40 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } },
            { title: "La Grande Vague de Kanagawa", image: "la-grande-vague-de-kanagawa.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Katsushika Hokusai" }, date: { question: "Date (Année) :", correct: "1831" }, taille: { question: "Taille (arrondi au cm) :", correct: "26 x 38 cm" }, technique: { question: "Technique :", correct: "Estampe (gravure sur bois, ukiyo-e)" } },
            { title: "Impression, soleil levant", image: "impression-soleil-levant.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Claude Monet" }, date: { question: "Date (Année) :", correct: "1872" }, taille: { question: "Taille (arrondi au cm) :", correct: "48 x 63 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } },
            { title: "Le Penseur", image: "le-penseur.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Auguste Rodin" }, date: { question: "Date (Année) :", correct: "1904" }, taille: { question: "Taille (arrondi au cm) :", correct: "189 x 98 x 140 cm" }, technique: { question: "Technique :", correct: "Sculpture en bronze" } },
            { title: "La Nuit étoilée", image: "la-nuit-etoilee.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Vincent van Gogh" }, date: { question: "Date (Année) :", correct: "1889" }, taille: { question: "Taille (arrondi au cm) :", correct: "74 x 92 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } },
            { title: "Le Cri", image: "le-cri.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Edvard Munch" }, date: { question: "Date (Année) :", correct: "1893" }, taille: { question: "Taille (arrondi au cm) :", correct: "91 x 74 cm" }, technique: { question: "Technique :", correct: "Huile, tempera et pastel sur carton" } },
            { title: "American Gothic", image: "american-gothic.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Grant Wood" }, date: { question: "Date (Année) :", correct: "1930" }, taille: { question: "Taille (arrondi au cm) :", correct: "78 x 65 cm" }, technique: { question: "Technique :", correct: "Huile sur panneau de beaverboard" } },
            { title: "La Persistance de la mémoire", image: "la-persistance-de-la-memoire.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Salvador Dalí" }, date: { question: "Date (Année) :", correct: "1931" }, taille: { question: "Taille (arrondi au cm) :", correct: "24 x 33 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } },
            { title: "Guernica", image: "guernica.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Pablo Picasso" }, date: { question: "Date (Année) :", correct: "1937" }, taille: { question: "Taille (arrondi au cm) :", correct: "349 x 776 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } },
            { title: "Nighthawks", image: "nighthawks.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Edward Hopper" }, date: { question: "Date (Année) :", correct: "1942" }, taille: { question: "Taille (arrondi au cm) :", correct: "84 x 153 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } },
            { title: "Diptyque de Marilyn", image: "diptyque-de-marilyn.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Andy Warhol" }, date: { question: "Date (Année) :", correct: "1962" }, taille: { question: "Taille (arrondi au cm) :", correct: "205 x 290 cm" }, technique: { question: "Technique :", correct: "Sérigraphie sur toile" } },
            { title: "Le Fils de l'homme", image: "le-fils-de-l-homme.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "René Magritte" }, date: { question: "Date (Année) :", correct: "1964" }, taille: { question: "Taille (arrondi au cm) :", correct: "116 x 89 cm" }, technique: { question: "Technique :", correct: "Huile sur toile" } }
        ];

        let selectedPlayerIndex = null;
        let selectedTileId = null;
        let gameData = { count: 5, colors: { 1: 'purple', 2: 'blue', 3: 'green', 4: 'red', 5: 'yellow' }, names: {}, difficulty: 'easy' };
        
        let playerSuccessColors = {}; 
        let recentArtworksHistory = []; // Historique pour éviter les répétitions en boucle

        let currentActiveArtwork = null;
        let currentActiveCategoryKey = null;

        function initApp() {
            loadGameData();
            renderPlayers();
        }

        function loadGameData() {
            const stored = localStorage.getItem('bg_helper_game_players');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed && parsed.count) {
                        gameData = parsed;
                    }
                } catch (e) {
                    console.warn('Fallback to default setup');
                }
            }
        }

        function renderPlayers() {
            const container = document.getElementById('playersGrid');
            if (!container) return;
            container.innerHTML = '';

            const totalPlayers = gameData.count || 5;

            for (let i = 1; i <= totalPlayers; i++) {
                const colorId = (gameData.colors && gameData.colors[i]) || COLOR_OPTIONS[(i - 1) % COLOR_OPTIONS.length].id;
                const colorObj = COLOR_OPTIONS.find(c => c.id === colorId) || COLOR_OPTIONS[0];
                const playerName = (gameData.names && gameData.names[i]) ? gameData.names[i] : `Joueur ${i}`;

                const successSet = playerSuccessColors[i] || new Set();
                const hasWon = successSet.size >= 5;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `player-card-${i}`;
                btn.onclick = () => selectPlayer(i, colorObj, playerName);
                btn.className = `player-btn flex-1 min-w-0 flex flex-col items-center justify-center p-1.5 sm:p-2 rounded-xl border-2 ${hasWon ? 'border-amber-400 bg-amber-500/30 animate-pulse' : 'border-[#417E94] bg-[#2D5766]'} hover:bg-[#417E94]/40 transition text-center cursor-pointer shadow-md group`;

                btn.innerHTML = `
                    <div class="w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center relative my-0.5">
                        <img src="assets/${colorObj.sprite}" alt="${colorObj.name}" class="w-full h-full object-contain drop-shadow" onerror="handleSpriteError(this)">
                        <div class="fallback-cross hidden absolute inset-0 items-center justify-center text-rose-500">
                            <i class="fa-solid fa-xmark text-sm sm:text-base"></i>
                        </div>
                    </div>
                    <span class="text-[11px] sm:text-xs font-extrabold text-white group-hover:text-[#65C3E6] truncate w-full">${playerName} ${hasWon ? '👑' : ''}</span>
                    <span class="text-[9px] sm:text-[10px] font-semibold px-1.5 sm:px-2 py-0.5 rounded-full ${colorObj.bgClass} text-white shadow-sm mt-0.5 truncate max-w-full">${colorObj.name} (${successSet.size}/5)</span>
                `;

                container.appendChild(btn);
            }
        }

        function selectPlayer(index, colorObj, playerName) {
            selectedPlayerIndex = index;
            selectedTileId = null;

            document.querySelectorAll('.player-btn').forEach((btn, idx) => {
                if (idx + 1 === index) {
                    btn.classList.remove('border-[#417E94]', 'bg-[#2D5766]');
                    btn.classList.add('border-[#65C3E6]', 'bg-[#417E94]/80', 'ring-2', 'ring-[#65C3E6]/50');
                } else {
                    btn.classList.remove('border-[#65C3E6]', 'bg-[#417E94]/80', 'ring-2', 'ring-[#65C3E6]/50');
                    btn.classList.add('border-[#417E94]', 'bg-[#2D5766]');
                }
            });

            const label = document.getElementById('selectedPlayerLabel');
            if (label) {
                label.textContent = `${playerName} (${colorObj.name})`;
            }

            const caseSection = document.getElementById('quelleCaseSection');
            if (caseSection) {
                caseSection.classList.remove('hidden');
                caseSection.classList.add('flex');
            }

            const actionPanel = document.getElementById('actionPanel');
            if (actionPanel) actionPanel.classList.add('hidden');

            const questionContainer = document.getElementById('questionContainer');
            if (questionContainer) questionContainer.classList.add('hidden');

            const multicolorNotice = document.getElementById('multicolorNotice');
            if (multicolorNotice) multicolorNotice.classList.add('hidden');

            renderTiles();
        }

        function renderTiles() {
            const container = document.getElementById('tilesGrid');
            if (!container) return;
            container.innerHTML = '';

            const allTiles = [...COLOR_OPTIONS, MULTICOLOR_TILE];
            const successSet = playerSuccessColors[selectedPlayerIndex] || new Set();

            allTiles.forEach(tile => {
                const isSuccess = successSet.has(tile.id);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `tile-btn-${tile.id}`;
                
                if (isSuccess) {
                    btn.className = `tile-btn flex items-center gap-2.5 p-2.5 rounded-xl border border-[#03fc07] text-white shadow-md text-left w-full cursor-pointer hover:brightness-110`;
                    btn.style.backgroundColor = '#03fc07';
                } else {
                    btn.className = `tile-btn flex items-center gap-2.5 p-2.5 rounded-xl border border-white/20 ${tile.bgClass} text-white shadow-md transition cursor-pointer text-left w-full hover:brightness-110`;
                }

                btn.onclick = () => selectTile(tile);

                let iconMarkup = '';
                if (tile.isMulticolor) {
                    iconMarkup = `
                        <div class="w-6 h-6 shrink-0 relative rounded overflow-hidden grid grid-cols-2 grid-rows-2 border border-white/30 shadow-sm">
                            <div class="bg-blue-500"></div>
                            <div class="bg-amber-400"></div>
                            <div class="bg-red-500"></div>
                            <div class="bg-emerald-500"></div>
                            <div class="absolute inset-[18%] bg-purple-600 rounded-sm shadow border border-white/40"></div>
                        </div>
                    `;
                } else {
                    iconMarkup = `
                        <div class="w-6 h-6 shrink-0 flex items-center justify-center bg-black/20 rounded-lg text-white">
                            <i class="fa-solid ${tile.icon} text-xs"></i>
                        </div>
                    `;
                }

                let statusText = isSuccess ? '(Réussi - Rejouable)' : '';

                btn.innerHTML = `
                    ${iconMarkup}
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-bold leading-tight truncate ${isSuccess ? 'text-black' : ''}">${tile.name} ${statusText}</div>
                        <div class="text-[10px] font-medium uppercase tracking-wider ${isSuccess ? 'text-black/80' : 'opacity-90'} truncate">${tile.category}</div>
                    </div>
                    <i class="fa-solid ${isSuccess ? 'fa-check text-black' : 'fa-circle-check opacity-0 check-tile-icon'} text-xs shrink-0"></i>
                `;

                container.appendChild(btn);
            });
        }

        function selectTile(tile) {
            selectedTileId = tile.id;

            document.querySelectorAll('.tile-btn').forEach(btn => {
                const icon = btn.querySelector('.check-tile-icon');
                if (btn.id === `tile-btn-${tile.id}`) {
                    btn.classList.add('ring-2', 'ring-white', 'shadow-lg');
                    if (icon) icon.classList.remove('opacity-0');
                } else {
                    btn.classList.remove('ring-2', 'ring-white', 'shadow-lg');
                    if (icon) icon.classList.add('opacity-0');
                }
            });

            const playerName = (gameData.names && gameData.names[selectedPlayerIndex]) ? gameData.names[selectedPlayerIndex] : `Joueur ${selectedPlayerIndex}`;

            const multicolorNotice = document.getElementById('multicolorNotice');
            const questionContainer = document.getElementById('questionContainer');

            if (tile.id === 'multicolor') {
                if (multicolorNotice) {
                    multicolorNotice.textContent = `${playerName} peut réviser jusqu'à son prochain tour !`;
                    multicolorNotice.classList.remove('hidden');
                }
                if (questionContainer) questionContainer.classList.add('hidden');
            } else {
                if (multicolorNotice) multicolorNotice.classList.add('hidden');
                generateQuestionForTile(tile);
            }

            const actionPanel = document.getElementById('actionPanel');
            const summaryText = document.getElementById('actionSummaryText');

            if (actionPanel && summaryText) {
                summaryText.innerHTML = `${playerName} sur case <span class="font-bold underline">${tile.name}</span> (${tile.category})`;
                actionPanel.classList.remove('hidden');
                actionPanel.classList.add('flex');
            }
        }

        function generateQuestionForTile(tile) {
            currentActiveCategoryKey = tile.category;
            
            // Anti-répétition : sélection d'une œuvre aléatoire non présente dans les 5 dernières jouées
            let availableArtworks = ARTWORKS_DB.filter(a => !recentArtworksHistory.includes(a.title));
            if (availableArtworks.length === 0) {
                recentArtworksHistory = [];
                availableArtworks = ARTWORKS_DB;
            }
            const randomIndex = Math.floor(Math.random() * availableArtworks.length);
            currentActiveArtwork = availableArtworks[randomIndex];

            // Mettre à jour l'historique récent (garde en mémoire les 5 dernières)
            recentArtworksHistory.push(currentActiveArtwork.title);
            if (recentArtworksHistory.length > 5) {
                recentArtworksHistory.shift();
            }

            const questionContainer = document.getElementById('questionContainer');
            if (!questionContainer) return;

            questionContainer.classList.remove('hidden');
            questionContainer.classList.add('flex');

            const titleEl = document.getElementById('artworkTitleDisplay');
            const imgEl = document.getElementById('artworkImgDisplay');
            const qTextEl = document.getElementById('questionTextDisplay');
            const optionsArea = document.getElementById('easyOptionsArea');
            const hardArea = document.getElementById('hardInputArea');
            const feedbackEl = document.getElementById('questionFeedback');

            if (feedbackEl) {
                feedbackEl.innerHTML = '';
                feedbackEl.className = 'hidden';
            }

            if (imgEl) {
                imgEl.src = `assets/${currentActiveArtwork.image}`;
                imgEl.alt = currentActiveArtwork.title;
            }

            if (titleEl) {
                if (currentActiveCategoryKey === 'titre') {
                    titleEl.innerHTML = `<span class="italic text-emerald-300">Œuvre mystère (Devinez le titre)</span>`;
                } else {
                    titleEl.innerHTML = `Œuvre : <span class="font-bold text-amber-200">${currentActiveArtwork.title}</span>`;
                }
            }

            const currentDifficulty = gameData.difficulty || 'easy';

            if (currentDifficulty === 'easy') {
                if (hardArea) hardArea.classList.add('hidden');
                if (optionsArea) {
                    optionsArea.classList.remove('hidden');
                    optionsArea.innerHTML = '';

                    let qObj;
                    if (currentActiveCategoryKey === 'titre') {
                        const otherTitles = ARTWORKS_DB.filter(a => a.title !== currentActiveArtwork.title).map(a => a.title);
                        otherTitles.sort(() => Math.random() - 0.5);
                        let choices = [currentActiveArtwork.title, otherTitles[0], otherTitles[1]];
                        choices.sort(() => Math.random() - 0.5);
                        qObj = { question: "Quel est le titre de cette œuvre ?", options: choices, correct: currentActiveArtwork.title };
                    } else {
                        const correctVal = currentActiveArtwork[currentActiveCategoryKey].correct;
                        let pool = ARTWORKS_DB.map(a => a[currentActiveCategoryKey].correct).filter(val => val !== correctVal);
                        pool.sort(() => Math.random() - 0.5);
                        let choices = [correctVal, pool[0], pool[1]];
                        choices.sort(() => Math.random() - 0.5);
                        qObj = { question: currentActiveArtwork[currentActiveCategoryKey].question, options: choices, correct: correctVal };
                    }

                    if (qTextEl) qTextEl.textContent = qObj.question;

                    qObj.options.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.type = 'button';
                        optBtn.className = 'option-btn w-full text-left p-2.5 rounded-xl bg-[#1D3842] hover:bg-[#417E94] border border-[#417E94] text-xs font-semibold text-white transition shadow-sm';
                        optBtn.textContent = opt;
                        optBtn.onclick = () => checkEasyAnswer(opt, qObj.correct);
                        optionsArea.appendChild(optBtn);
                    });
                }
            } else {
                if (optionsArea) optionsArea.classList.add('hidden');
                if (hardArea) {
                    hardArea.classList.remove('hidden');
                    let qObj;
                    let correctVal = '';
                    if (currentActiveCategoryKey === 'titre') {
                        correctVal = currentActiveArtwork.title;
                        qObj = { question: "Quel est le titre de cette œuvre ?" };
                    } else {
                        correctVal = currentActiveArtwork[currentActiveCategoryKey].correct;
                        qObj = currentActiveArtwork[currentActiveCategoryKey];
                    }
                    if (qTextEl) qTextEl.textContent = qObj.question;

                    const selectEl = document.getElementById('hardSelectAnswer');
                    if (selectEl) {
                        selectEl.innerHTML = `<option value="" disabled selected>-- Choisissez parmi les 15 options --</option>`;
                        let allOptionsPool = ARTWORKS_DB.map(a => currentActiveCategoryKey === 'titre' ? a.title : a[currentActiveCategoryKey].correct);
                        allOptionsPool = [...new Set(allOptionsPool)];
                        allOptionsPool.sort(() => Math.random() - 0.5);

                        allOptionsPool.forEach(optVal => {
                            const optElem = document.createElement('option');
                            optElem.value = optVal;
                            optElem.textContent = optVal;
                            selectEl.appendChild(optElem);
                        });
                        selectEl.disabled = false;
                    }

                    const submitBtn = document.getElementById('hardSubmitBtn');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            }
        }

        function checkEasyAnswer(selectedOption, correctOption) {
            const feedbackEl = document.getElementById('questionFeedback');
            if (!feedbackEl) return;
            feedbackEl.classList.remove('hidden');

            if (selectedOption === correctOption) {
                markColorAsSuccess(selectedPlayerIndex, selectedTileId);
                feedbackEl.className = 'p-3 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-200 text-xs font-bold text-center';
                feedbackEl.innerHTML = `<div class="text-sm font-extrabold text-[#03fc07]">Réussi !</div>`;
            } else {
                feedbackEl.className = 'p-3 rounded-xl bg-rose-500/20 border border-rose-500 text-rose-200 text-xs font-semibold text-center';
                feedbackEl.innerHTML = `<div class="text-sm font-extrabold text-rose-300">Pas réussi !</div>`;
            }
        }

        function submitHardAnswer() {
            const selectEl = document.getElementById('hardSelectAnswer');
            if (!selectEl) return;

            const userVal = selectEl.value;
            if (!userVal) return;

            let correctVal = '';
            if (currentActiveCategoryKey === 'titre') {
                correctVal = currentActiveArtwork.title;
            } else {
                correctVal = currentActiveArtwork[currentActiveCategoryKey].correct;
            }

            const isCorrect = (userVal === correctVal);
            const feedbackEl = document.getElementById('questionFeedback');
            if (!feedbackEl) return;
            feedbackEl.classList.remove('hidden');

            if (isCorrect) {
                markColorAsSuccess(selectedPlayerIndex, selectedTileId);
                feedbackEl.className = 'p-3 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-200 text-xs font-bold text-center';
                feedbackEl.innerHTML = `<div class="text-sm font-extrabold text-[#03fc07]">Réussi !</div>`;
            } else {
                feedbackEl.className = 'p-3 rounded-xl bg-rose-500/20 border border-rose-500 text-rose-200 text-xs font-semibold text-center';
                feedbackEl.innerHTML = `<div class="text-sm font-extrabold text-rose-300">Pas réussi !</div>`;
            }
        }

        function markColorAsSuccess(playerIdx, tileId) {
            if (!playerSuccessColors[playerIdx]) {
                playerSuccessColors[playerIdx] = new Set();
            }
            playerSuccessColors[playerIdx].add(tileId);

            renderTiles();
            renderPlayers();

            if (playerSuccessColors[playerIdx].size >= 5) {
                const playerName = (gameData.names && gameData.names[playerIdx]) ? gameData.names[playerIdx] : `Joueur ${playerIdx}`;
                setTimeout(() => {
                    alert(`🏆 VICTOIRE ! ${playerName} a réussi toutes ses couleurs et a gagné la partie !`);
                }, 300);
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</head>
<body class="min-h-full h-auto bg-[#1D3842] text-slate-100 flex flex-col items-center justify-start p-2 sm:p-4 max-w-xl mx-auto overflow-y-auto">

    <main class="w-full flex flex-col gap-3 pb-4">

        <!-- SECTION 1: PLAYERS SELECTION -->
        <section id="playersSection" class="bg-[#2D5766] border border-[#417E94] rounded-2xl p-2.5 sm:p-3 shadow-xl">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-users text-[#65C3E6]"></i> Sélectionner un joueur
                </h2>
                <span class="text-[10px] text-slate-300">Premier à tout faire juste gagne !</span>
            </div>
            <div id="playersGrid" class="grid grid-cols-5 gap-1 sm:gap-1.5 w-full"></div>
        </section>

        <!-- SECTION 2: QUELLE CASE ? -->
        <section id="quelleCaseSection" class="hidden bg-[#2D5766] border border-[#417E94] rounded-2xl p-3 shadow-xl flex-col gap-2.5">
            <div class="flex items-center justify-between border-b border-[#417E94]/60 pb-2">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#65C3E6] animate-ping"></div>
                    <h3 class="text-sm font-extrabold text-white">Quelle case ?</h3>
                </div>
                <span id="selectedPlayerLabel" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-[#1D3842] text-[#65C3E6] border border-[#417E94] truncate max-w-[160px] sm:max-w-xs">
                    Joueur sélectionné
                </span>
            </div>

            <div id="tilesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>

            <div id="multicolorNotice" class="hidden text-amber-200 text-xs font-semibold text-center py-2 px-3 bg-amber-500/20 border border-amber-400/40 rounded-xl"></div>

            <div id="actionPanel" class="hidden flex-col gap-2 pt-1 border-t border-[#417E94]/60">
                <div class="flex items-center justify-between gap-2">
                    <span id="actionSummaryText" class="text-xs text-slate-200 truncate"></span>
                </div>
            </div>

            <!-- SECTION 3: QUESTIONNAIRE -->
            <div id="questionContainer" class="hidden flex-col gap-2.5 bg-[#1D3842] border border-[#417E94] rounded-xl p-3 shadow-inner">
                <div class="flex items-center justify-between">
                    <span id="artworkTitleDisplay" class="text-xs font-bold text-amber-300"></span>
                    <span class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 bg-[#2D5766] px-2 py-0.5 rounded border border-[#417E94]">Défi Art</span>
                </div>

                <div class="w-full h-40 sm:h-48 bg-black/30 rounded-lg overflow-hidden flex items-center justify-center border border-[#417E94]/50">
                    <img id="artworkImgDisplay" src="" alt="Œuvre d'art" class="w-full h-full object-contain">
                </div>

                <div id="questionTextDisplay" class="text-xs font-semibold text-white leading-relaxed"></div>

                <!-- Easy Mode (QCM aléatoire) -->
                <div id="easyOptionsArea" class="flex flex-col gap-1.5 hidden"></div>

                <!-- Hard Mode (Choix parmi les 15 options) -->
                <div id="hardInputArea" class="flex flex-col gap-2 hidden">
                    <div class="flex flex-col gap-2">
                        <select id="hardSelectAnswer" class="w-full bg-[#2D5766] border border-[#417E94] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#65C3E6]">
                            <option value="" disabled selected>-- Choisissez parmi les 15 options --</option>
                        </select>
                        <button type="button" id="hardSubmitBtn" onclick="submitHardAnswer()" class="bg-[#65C3E6] hover:bg-[#417E94] text-[#1D3842] hover:text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow">Valider</button>
                    </div>
                </div>

                <div id="questionFeedback" class="hidden"></div>
            </div>

        </section>

    </main>

</body>
</html>
