<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#1D3842]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Board Game Helper - Jouer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.94) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .popup-animate {
            animation: popIn 0.2s ease-out forwards;
        }
    </style>
    <script>
        function handleSpriteError(imgElem) {
            imgElem.style.display = 'none';
            const fallbackElem = imgElem.nextElementSibling;
            if (fallbackElem && fallbackElem.classList.contains('fallback-cross')) {
                fallbackElem.classList.remove('hidden');
                fallbackElem.classList.add('flex');
            }
        }

        const COLOR_OPTIONS = [
            { id: 'purple', name: 'Violet', category: 'taille', icon: 'fa-ruler-combined', bgClass: 'bg-purple-600', borderClass: 'border-purple-500', sprite: 'BLAB.svg', ringColor: '#9333ea' },
            { id: 'blue', name: 'Bleu', category: 'titre', icon: 'fa-heading', bgClass: 'bg-blue-600', borderClass: 'border-blue-500', sprite: 'BLEB.svg', ringColor: '#2563eb' },
            { id: 'green', name: 'Vert', category: 'auteur', icon: 'fa-user-pen', bgClass: 'bg-emerald-600', borderClass: 'border-emerald-500', sprite: 'BLIB.svg', ringColor: '#059669' },
            { id: 'red', name: 'Rouge', category: 'date', icon: 'fa-calendar-days', bgClass: 'bg-red-600', borderClass: 'border-red-500', sprite: 'BLOB.svg', ringColor: '#dc2626' },
            { id: 'yellow', name: 'Jaune', category: 'technique', icon: 'fa-gears', bgClass: 'bg-amber-500', borderClass: 'border-amber-400', sprite: 'BLUB.svg', ringColor: '#d97706' }
        ];

        const ARTWORKS_DB = [
            { title: "La Cène", image: "la-cene.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Léonard de Vinci" }, date: { question: "Date (Année) :", correct: "1498" }, taille: { question: "Taille (arrondi au cm) :", correct: "460 x 880 cm" }, technique: { question: "Technique :", correct: "Peinture murale" } },
            { title: "La Joconde", image: "la-joconde.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Léonard de Vinci" }, date: { question: "Date (Année) :", correct: "1503" }, taille: { question: "Taille (arrondi au cm) :", correct: "77 x 53 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "La Ronde de nuit", image: "la-ronde-de-nuit.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Rembrandt" }, date: { question: "Date (Année) :", correct: "1642" }, taille: { question: "Taille (arrondi au cm) :", correct: "379 x 454 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "La Jeune Fille à la perle", image: "la-jeune-fille-a-la-perle.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Johannes Vermeer" }, date: { question: "Date (Année) :", correct: "1665" }, taille: { question: "Taille (arrondi au cm) :", correct: "45 x 40 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "La Grande Vague de Kanagawa", image: "la-grande-vague-de-kanagawa.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Katsushika Hokusai" }, date: { question: "Date (Année) :", correct: "1831" }, taille: { question: "Taille (arrondi au cm) :", correct: "26 x 38 cm" }, technique: { question: "Technique :", correct: "Estampe (gravure)" } },
            { title: "Impression, soleil levant", image: "impression-soleil-levant.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Claude Monet" }, date: { question: "Date (Année) :", correct: "1872" }, taille: { question: "Taille (arrondi au cm) :", correct: "48 x 63 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "Le Penseur", image: "le-penseur.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Auguste Rodin" }, date: { question: "Date (Année) :", correct: "1904" }, taille: { question: "Taille (arrondi au cm) :", correct: "189 x 98 x 140 cm" }, technique: { question: "Technique :", correct: "Sculpture en bronze" } },
            { title: "La Nuit étoilée", image: "la-nuit-etoilee.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Vincent van Gogh" }, date: { question: "Date (Année) :", correct: "1889" }, taille: { question: "Taille (arrondi au cm) :", correct: "74 x 92 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "Le Cri", image: "le-cri.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Edvard Munch" }, date: { question: "Date (Année) :", correct: "1893" }, taille: { question: "Taille (arrondi au cm) :", correct: "91 x 74 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "American Gothic", image: "american-gothic.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Grant Wood" }, date: { question: "Date (Année) :", correct: "1930" }, taille: { question: "Taille (arrondi au cm) :", correct: "78 x 65 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "La Persistance de la mémoire", image: "la-persistance-de-la-memoire.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Salvador Dalí" }, date: { question: "Date (Année) :", correct: "1931" }, taille: { question: "Taille (arrondi au cm) :", correct: "24 x 33 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "Guernica", image: "guernica.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Pablo Picasso" }, date: { question: "Date (Année) :", correct: "1937" }, taille: { question: "Taille (arrondi au cm) :", correct: "349 x 776 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "Nighthawks", image: "nighthawks.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Edward Hopper" }, date: { question: "Date (Année) :", correct: "1942" }, taille: { question: "Taille (arrondi au cm) :", correct: "84 x 153 cm" }, technique: { question: "Technique :", correct: "Huile" } },
            { title: "Diptyque de Marilyn", image: "diptyque-de-marilyn.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "Andy Warhol" }, date: { question: "Date (Année) :", correct: "1962" }, taille: { question: "Taille (arrondi au cm) :", correct: "205 x 290 cm" }, technique: { question: "Technique :", correct: "Sérigraphie" } },
            { title: "Le Fils de l'homme", image: "le-fils-de-l-homme.jpg", auteur: { question: "Auteur de l'œuvre :", correct: "René Magritte" }, date: { question: "Date (Année) :", correct: "1964" }, taille: { question: "Taille (arrondi au cm) :", correct: "116 x 89 cm" }, technique: { question: "Technique :", correct: "Huile" } }
        ];

        let selectedPlayerIndex = null;
        let selectedTileId = null;
        let selectedTileObj = null;
        let gameData = { count: 5, colors: { 1: 'purple', 2: 'blue', 3: 'green', 4: 'red', 5: 'yellow' }, names: {}, difficulty: 'easy' };

        let playerSuccessColors = {};
        let playerFailedColor = {};
        let lastAnsweredQuestionKey = null;
        let recentArtworksHistory = [];

        let gameWon = false;
        let winningPlayerIndex = null;

        let currentActiveArtwork = null;
        let currentActiveCategoryKey = null;

        function getPlayerName(index) {
            return (gameData.names && gameData.names[index]) ? gameData.names[index] : `Joueur ${index}`;
        }

        function initApp() {
            loadGameData();
            renderPlayers();
        }

        function loadGameData() {
            const stored = localStorage.getItem('bg_helper_game_players');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed && parsed.count) {
                        gameData = parsed;
                    }
                } catch (e) {
                    console.warn('Fallback to default setup');
                }
            }
        }

        function renderPlayers() {
            const container = document.getElementById('playersGrid');
            if (!container) return;
            container.innerHTML = '';

            const totalPlayers = gameData.count || 5;

            for (let i = 1; i <= totalPlayers; i++) {
                const colorId = (gameData.colors && gameData.colors[i]) || COLOR_OPTIONS[(i - 1) % COLOR_OPTIONS.length].id;
                const colorObj = COLOR_OPTIONS.find(c => c.id === colorId) || COLOR_OPTIONS[0];
                const playerName = getPlayerName(i);

                const successSet = playerSuccessColors[i] || new Set();
                const hasWon = successSet.size >= 5 || winningPlayerIndex === i;
                const isSelected = (selectedPlayerIndex === i);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `player-card-${i}`;
                btn.onclick = () => selectPlayer(i, colorObj, playerName);

                let stateClasses = isSelected
                    ? 'border-[#65C3E6] bg-[#417E94]/80 ring-2 ring-[#65C3E6]/50'
                    : (hasWon ? 'border-amber-400 bg-amber-500/30 animate-pulse' : 'border-[#417E94] bg-[#2D5766]');

                btn.className = `player-btn flex-1 min-w-0 flex flex-col items-center justify-center p-1.5 sm:p-2 rounded-xl border-2 ${stateClasses} hover:bg-[#417E94]/40 transition text-center shadow-md group cursor-pointer`;

                btn.innerHTML = `
                    <div class="w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center relative my-0.5">
                        <img src="assets/${colorObj.sprite}" alt="${colorObj.name}" class="w-full h-full object-contain drop-shadow" onerror="handleSpriteError(this)">
                        <div class="fallback-cross hidden absolute inset-0 items-center justify-center text-rose-500">
                            <i class="fa-solid fa-xmark text-sm sm:text-base"></i>
                        </div>
                    </div>
                    <span class="text-[11px] sm:text-xs font-extrabold text-white group-hover:text-[#65C3E6] truncate w-full">${playerName} ${hasWon ? '👑' : ''}</span>
                    <span class="text-[9px] sm:text-[10px] font-semibold px-1.5 sm:px-2 py-0.5 rounded-full ${colorObj.bgClass} text-white shadow-sm mt-0.5 truncate max-w-full">${colorObj.name} (${successSet.size}/5)</span>
                `;

                container.appendChild(btn);
            }
        }

        function selectPlayer(index, colorObj, playerName) {
            selectedPlayerIndex = index;
            deselectColor();

            renderPlayers();

            const label = document.getElementById('selectedPlayerLabel');
            if (label) {
                label.textContent = `${playerName} (${colorObj.name})`;
            }

            const caseSection = document.getElementById('quelleCaseSection');
            if (caseSection) {
                caseSection.classList.remove('hidden');
                caseSection.classList.add('flex');
            }

            renderTiles();
        }

        function deselectColor() {
            selectedTileId = null;
            selectedTileObj = null;
            currentActiveArtwork = null;
            currentActiveCategoryKey = null;

            document.querySelectorAll('.tile-btn').forEach(btn => {
                const icon = btn.querySelector('.check-tile-icon');
                btn.classList.remove('ring-2', 'ring-white', 'shadow-lg');
                if (icon) icon.classList.add('opacity-0');
            });

            const actionPanel = document.getElementById('actionPanel');
            if (actionPanel) {
                actionPanel.classList.add('hidden');
                actionPanel.classList.remove('flex');
            }

            const openBtn = document.getElementById('openQuestionBtn');
            if (openBtn) {
                openBtn.classList.add('hidden');
                openBtn.disabled = true;
                openBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function updateOpenQuestionButton() {
            const openBtn = document.getElementById('openQuestionBtn');
            if (!openBtn) return;

            const successSet = playerSuccessColors[selectedPlayerIndex] || new Set();
            const isAlreadySuccess = selectedTileId && successSet.has(selectedTileId);
            const isBlocked = gameWon || !selectedTileId || isAlreadySuccess || (selectedTileId === playerFailedColor[selectedPlayerIndex]);

            if (isBlocked) {
                openBtn.disabled = true;
                openBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                openBtn.disabled = false;
                openBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function renderTiles() {
            const container = document.getElementById('tilesGrid');
            if (!container) return;
            container.innerHTML = '';

            const successSet = playerSuccessColors[selectedPlayerIndex] || new Set();
            const failedColorId = playerFailedColor[selectedPlayerIndex];

            COLOR_OPTIONS.forEach(tile => {
                const isSuccess = successSet.has(tile.id);
                const isFailedBlock = (tile.id === failedColorId);
                const isDisabled = isSuccess || isFailedBlock;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `tile-btn-${tile.id}`;
                btn.disabled = isDisabled;
                btn.onclick = () => selectTile(tile);

                if (isFailedBlock) {
                    btn.className = `tile-btn flex items-center gap-2.5 p-2.5 rounded-xl border border-rose-500 bg-rose-950/60 text-rose-300 opacity-75 cursor-not-allowed text-left w-full`;
                    btn.style.boxShadow = 'none';
                } else if (isSuccess) {
                    btn.className = `tile-btn flex items-center gap-2.5 p-2.5 rounded-xl ${tile.bgClass} text-white opacity-80 cursor-not-allowed text-left w-full`;
                    btn.style.boxShadow = `0 0 0 4px #1D3842, 0 0 0 8px ${tile.ringColor}`;
                } else {
                    btn.className = `tile-btn flex items-center gap-2.5 p-2.5 rounded-xl border border-white/20 ${tile.bgClass} text-white shadow-md transition cursor-pointer text-left w-full hover:brightness-110`;
                    btn.style.boxShadow = 'none';
                }

                btn.innerHTML = `
                    <div class="w-6 h-6 shrink-0 flex items-center justify-center bg-black/20 rounded-lg text-white">
                        <i class="fa-solid ${tile.icon} text-xs"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-bold leading-tight truncate">${tile.name}</div>
                        <div class="text-[10px] font-medium uppercase tracking-wider opacity-90 truncate">${tile.category}</div>
                    </div>
                    <i class="fa-solid ${isSuccess ? 'fa-check' : (isFailedBlock ? 'fa-lock' : 'fa-circle-check opacity-0 check-tile-icon')} text-xs shrink-0"></i>
                `;

                container.appendChild(btn);
            });
        }

        function selectTile(tile) {
            const successSet = playerSuccessColors[selectedPlayerIndex] || new Set();
            if (successSet.has(tile.id) || tile.id === playerFailedColor[selectedPlayerIndex]) return;

            selectedTileId = tile.id;
            selectedTileObj = tile;

            document.querySelectorAll('.tile-btn').forEach(btn => {
                const icon = btn.querySelector('.check-tile-icon');
                if (btn.id === `tile-btn-${tile.id}`) {
                    btn.classList.add('ring-2', 'ring-white', 'shadow-lg');
                    if (icon) icon.classList.remove('opacity-0');
                } else {
                    btn.classList.remove('ring-2', 'ring-white', 'shadow-lg');
                    if (icon) icon.classList.add('opacity-0');
                }
            });

            const playerName = getPlayerName(selectedPlayerIndex);
            const actionPanel = document.getElementById('actionPanel');
            const summaryText = document.getElementById('actionSummaryText');
            const openBtn = document.getElementById('openQuestionBtn');

            if (!gameWon) {
                prepareQuestionForTile(tile);
            } else {
                currentActiveArtwork = null;
                currentActiveCategoryKey = null;
            }

            if (openBtn) {
                openBtn.classList.remove('hidden');
            }
            updateOpenQuestionButton();

            if (actionPanel && summaryText) {
                summaryText.innerHTML = `${playerName} sur case <span class="font-bold underline">${tile.name}</span> (${tile.category})`;
                actionPanel.classList.remove('hidden');
                actionPanel.classList.add('flex');
            }
        }

        function prepareQuestionForTile(tile) {
            if (!tile || gameWon) return;
            currentActiveCategoryKey = tile.category;

            let availableArtworks = ARTWORKS_DB.filter(a => !recentArtworksHistory.includes(a.title));
            if (availableArtworks.length === 0) {
                recentArtworksHistory = [];
                availableArtworks = ARTWORKS_DB;
            }
            const randomIndex = Math.floor(Math.random() * availableArtworks.length);
            currentActiveArtwork = availableArtworks[randomIndex];

            recentArtworksHistory.push(currentActiveArtwork.title);
            if (recentArtworksHistory.length > 5) {
                recentArtworksHistory.shift();
            }
        }

        function openQuestionPopup() {
            const successSet = playerSuccessColors[selectedPlayerIndex] || new Set();
            if (gameWon || !selectedTileId || successSet.has(selectedTileId) || selectedTileId === playerFailedColor[selectedPlayerIndex] || !currentActiveArtwork || !currentActiveCategoryKey) {
                updateOpenQuestionButton();
                return;
            }

            const modal = document.getElementById('questionPopupModal');
            if (!modal) return;

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const titleEl = document.getElementById('artworkTitleDisplay');
            const imgEl = document.getElementById('artworkImgDisplay');
            const qTextEl = document.getElementById('questionTextDisplay');
            const optionsArea = document.getElementById('easyOptionsArea');
            const hardArea = document.getElementById('hardInputArea');
            const feedbackEl = document.getElementById('questionFeedback');

            if (feedbackEl) {
                feedbackEl.innerHTML = '';
                feedbackEl.className = 'hidden';
            }

            if (imgEl) {
                imgEl.src = `assets/${currentActiveArtwork.image}`;
                imgEl.alt = currentActiveArtwork.title;
            }

            if (titleEl) {
                if (currentActiveCategoryKey === 'titre') {
                    titleEl.innerHTML = `<span class="italic text-emerald-300">Œuvre mystère (Devinez le titre)</span>`;
                } else {
                    titleEl.innerHTML = `Œuvre : <span class="font-bold text-amber-200">${currentActiveArtwork.title}</span>`;
                }
            }

            const currentDifficulty = gameData.difficulty || 'easy';

            if (currentDifficulty === 'easy') {
                if (hardArea) hardArea.classList.add('hidden');
                if (optionsArea) {
                    optionsArea.classList.remove('hidden');
                    optionsArea.innerHTML = '';

                    let qObj;
                    if (currentActiveCategoryKey === 'titre') {
                        const otherTitles = ARTWORKS_DB.filter(a => a.title !== currentActiveArtwork.title).map(a => a.title);
                        otherTitles.sort(() => Math.random() - 0.5);
                        let choices = [currentActiveArtwork.title, otherTitles[0], otherTitles[1]];
                        choices.sort(() => Math.random() - 0.5);
                        qObj = { question: "Quel est le titre de cette œuvre ?", options: choices, correct: currentActiveArtwork.title };
                    } else {
                        const correctVal = currentActiveArtwork[currentActiveCategoryKey].correct;
                        let pool = ARTWORKS_DB.map(a => a[currentActiveCategoryKey].correct).filter(val => val !== correctVal);
                        pool.sort(() => Math.random() - 0.5);
                        let choices = [correctVal, pool[0], pool[1]];
                        choices.sort(() => Math.random() - 0.5);
                        qObj = { question: currentActiveArtwork[currentActiveCategoryKey].question, options: choices, correct: correctVal };
                    }

                    if (qTextEl) qTextEl.textContent = qObj.question;

                    qObj.options.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.type = 'button';
                        optBtn.className = 'option-btn w-full text-left p-2.5 rounded-xl bg-[#1D3842] hover:bg-[#417E94] border border-[#417E94] text-xs font-semibold text-white transition shadow-sm cursor-pointer';
                        optBtn.textContent = opt;
                        optBtn.onclick = () => checkEasyAnswer(opt, qObj.correct);
                        optionsArea.appendChild(optBtn);
                    });
                }
            } else {
                if (optionsArea) optionsArea.classList.add('hidden');
                if (hardArea) {
                    hardArea.classList.remove('hidden');
                    let qObj;
                    if (currentActiveCategoryKey === 'titre') {
                        qObj = { question: "Quel est le titre de cette œuvre ?" };
                    } else {
                        qObj = currentActiveArtwork[currentActiveCategoryKey];
                    }
                    if (qTextEl) qTextEl.textContent = qObj.question;

                    const selectEl = document.getElementById('hardSelectAnswer');
                    if (selectEl) {
                        selectEl.innerHTML = `<option value="" disabled selected>-- Choisissez parmi les 15 options --</option>`;
                        let allOptionsPool = ARTWORKS_DB.map(a => currentActiveCategoryKey === 'titre' ? a.title : a[currentActiveCategoryKey].correct);
                        allOptionsPool = [...new Set(allOptionsPool)];
                        allOptionsPool.sort(() => Math.random() - 0.5);

                        allOptionsPool.forEach(optVal => {
                            const optElem = document.createElement('option');
                            optElem.value = optVal;
                            optElem.textContent = optVal;
                            selectEl.appendChild(optElem);
                        });
                        selectEl.disabled = false;
                    }

                    const submitBtn = document.getElementById('hardSubmitBtn');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            }
        }

        function closeQuestionPopup() {
            const modal = document.getElementById('questionPopupModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function disablePopupAnswerControls() {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-60', 'cursor-not-allowed');
            });
            const selectEl = document.getElementById('hardSelectAnswer');
            if (selectEl) selectEl.disabled = true;
            const submitBtn = document.getElementById('hardSubmitBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function handleAnswerResult(isCorrect) {
            if (gameWon) return;

            const answeredPlayer = selectedPlayerIndex;
            const answeredTile = selectedTileId;
            const thisQuestionKey = `${answeredPlayer}:${answeredTile}:${currentActiveArtwork ? currentActiveArtwork.title : ''}:${currentActiveCategoryKey}`;
            const isAnotherQuestion = (lastAnsweredQuestionKey !== null && lastAnsweredQuestionKey !== thisQuestionKey);

            if (isAnotherQuestion) {
                playerFailedColor[answeredPlayer] = null;
            }
            lastAnsweredQuestionKey = thisQuestionKey;

            disablePopupAnswerControls();
            const feedbackEl = document.getElementById('questionFeedback');
            if (!feedbackEl) return;
            feedbackEl.classList.remove('hidden');

            if (isCorrect) {
                markColorAsSuccess(answeredPlayer, answeredTile);
                triggerConfetti();
                feedbackEl.className = 'p-3 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-200 text-xs font-bold text-center';
                feedbackEl.innerHTML = `<div class="text-sm font-extrabold text-[#03fc07]">Bonne réponse</div>`;
            } else {
                markColorAsFailed(answeredPlayer, answeredTile);
                feedbackEl.className = 'p-3 rounded-xl bg-rose-500/20 border border-rose-500 text-rose-200 text-xs font-semibold text-center';
                feedbackEl.innerHTML = `<div class="text-sm font-extrabold text-rose-300">Mauvaise réponse</div>`;
            }

            deselectColor();
            renderTiles();
            updateOpenQuestionButton();

            setTimeout(() => {
                closeQuestionPopup();
            }, 900);
        }

        function checkEasyAnswer(selectedOption, correctOption) {
            handleAnswerResult(selectedOption === correctOption);
        }

        function submitHardAnswer() {
            const selectEl = document.getElementById('hardSelectAnswer');
            if (!selectEl) return;

            const userVal = selectEl.value;
            if (!userVal) return;

            let correctVal = '';
            if (currentActiveCategoryKey === 'titre') {
                correctVal = currentActiveArtwork.title;
            } else {
                correctVal = currentActiveArtwork[currentActiveCategoryKey].correct;
            }

            handleAnswerResult(userVal === correctVal);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function markColorAsSuccess(playerIdx, tileId) {
            if (!playerSuccessColors[playerIdx]) {
                playerSuccessColors[playerIdx] = new Set();
            }
            playerSuccessColors[playerIdx].add(tileId);
            if (playerFailedColor[playerIdx] === tileId) {
                playerFailedColor[playerIdx] = null;
            }

            if (playerSuccessColors[playerIdx].size >= 5) {
                gameWon = true;
                winningPlayerIndex = playerIdx;
            }

            renderPlayers();
        }

        function markColorAsFailed(playerIdx, tileId) {
            const successSet = playerSuccessColors[playerIdx] || new Set();
            const remainingColors = COLOR_OPTIONS.filter(c => !successSet.has(c.id));
            if (remainingColors.length <= 1) {
                playerFailedColor[playerIdx] = null;
                return;
            }
            playerFailedColor[playerIdx] = tileId;
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</head>
<body class="min-h-full h-auto bg-[#1D3842] text-slate-100 flex flex-col items-center justify-start p-2 sm:p-4 max-w-xl mx-auto overflow-y-auto">

                </div>
                <button type="button" id="openQuestionBtn" onclick="openQuestionPopup()" disabled class="hidden w-full py-2.5 px-4 rounded-xl bg-[#65C3E6] hover:bg-[#417E94] text-[#1D3842] hover:text-white font-extrabold text-xs sm:text-sm transition shadow-lg flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                    <i class="fa-solid fa-up-right-from-square"></i> Ouvrir la question
                </button>
            </div>

        </section>

    </main>

    <!-- POPUP MODALE: QUESTIONNAIRE -->
    <div id="questionPopupModal" class="hidden fixed inset-0 z-50 items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-xs">
        <div class="popup-animate w-full max-w-md bg-[#1D3842] border-2 border-[#65C3E6] rounded-2xl p-4 shadow-2xl flex flex-col gap-3 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-[#417E94]/60 pb-2">
                <span id="artworkTitleDisplay" class="text-xs sm:text-sm font-bold text-amber-300"></span>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] uppercase font-semibold tracking-wider text-slate-300 bg-[#2D5766] px-2 py-0.5 rounded border border-[#417E94]">Défi Art</span>
                    <button type="button" onclick="closeQuestionPopup()" aria-label="Fermer" class="w-7 h-7 rounded-lg bg-[#2D5766] hover:bg-rose-600 text-slate-200 hover:text-white flex items-center justify-center transition cursor-pointer">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="w-full h-44 sm:h-52 bg-black/35 rounded-xl overflow-hidden flex items-center justify-center border border-[#417E94]/50">
                <img id="artworkImgDisplay" src="" alt="Œuvre d'art" class="w-full h-full object-contain">
            </div>

            <div id="questionTextDisplay" class="text-xs sm:text-sm font-semibold text-white leading-relaxed"></div>

            <!-- Easy Mode (QCM aléatoire) -->
            <div id="easyOptionsArea" class="flex flex-col gap-1.5 hidden"></div>

            <!-- Hard Mode (Choix parmi les 15 options) -->
            <div id="hardInputArea" class="flex flex-col gap-2 hidden">
                <div class="flex flex-col gap-2">
                    <select id="hardSelectAnswer" class="w-full bg-[#2D5766] border border-[#417E94] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#65C3E6]">
                        <option value="" disabled selected>-- Choisissez parmi les 15 options --</option>
                    </select>
                    <button type="button" id="hardSubmitBtn" onclick="submitHardAnswer()" class="bg-[#65C3E6] hover:bg-[#417E94] text-[#1D3842] hover:text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow cursor-pointer">Valider</button>
                </div>

            <div id="questionFeedback" class="hidden"></div>
        </div>
