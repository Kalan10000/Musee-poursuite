<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#1D3842]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Board Game Helper - Jouer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        /**
         * Cross Placeholder Fallback for missing SVG sprites
         */
        function handleSpriteError(imgElem) {
            imgElem.style.display = 'none';
            const fallbackElem = imgElem.nextElementSibling;
            if (fallbackElem && fallbackElem.classList.contains('fallback-cross')) {
                fallbackElem.classList.remove('hidden');
                fallbackElem.classList.add('flex');
            }
        }

        // Available player colors setup in order: Violet, Bleu, Vert, Rouge, Jaune
        const COLOR_OPTIONS = [
            { id: 'purple', name: 'Violet', category: 'taille', icon: 'fa-ruler-combined', bgClass: 'bg-purple-600', borderClass: 'border-purple-500', sprite: 'BLAB.svg' },
            { id: 'blue', name: 'Bleu', category: 'titre', icon: 'fa-heading', bgClass: 'bg-blue-600', borderClass: 'border-blue-500', sprite: 'BLEB.svg' },
            { id: 'green', name: 'Vert', category: 'auteur', icon: 'fa-user-pen', bgClass: 'bg-emerald-600', borderClass: 'border-emerald-500', sprite: 'BLIB.svg' },
            { id: 'red', name: 'Rouge', category: 'date', icon: 'fa-calendar-days', bgClass: 'bg-red-600', borderClass: 'border-red-500', sprite: 'BLOB.svg' },
            { id: 'yellow', name: 'Jaune', category: 'technique', icon: 'fa-gears', bgClass: 'bg-amber-500', borderClass: 'border-amber-400', sprite: 'BLUB.svg' }
        ];

        const MULTICOLOR_TILE = {
            id: 'multicolor',
            name: 'Multicouleur',
            category: 'révision',
            icon: 'fa-shapes',
            bgClass: 'bg-gradient-to-br from-purple-700 via-emerald-600 to-amber-500',
            borderClass: 'border-amber-300',
            isMulticolor: true
        };

        // Database of 15 artworks with corresponding image filenames (.jpg)
        const ARTWORKS_DB = [
            { title: "La Cène", image: "la-cene.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Raphaël", "Michel-Ange", "Léonard de Vinci"], correct: "Léonard de Vinci" }, date: { question: "Date (Année) :", options: ["1515", "1425", "1498"], correct: "1498" }, taille: { question: "Taille (arrondi au cm) :", options: ["300 x 500 cm", "460 x 880 cm", "200 x 300 cm"], correct: "460 x 880 cm" }, technique: { question: "Technique :", options: ["Huile sur toile", "Peinture murale (tempera et huile sur plâtre)", "Fresque"], correct: "Peinture murale (tempera et huile sur plâtre)" } },
            { title: "La Joconde", image: "la-joconde.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Léonard de Vinci", "Le Caravage", "Sandro Botticelli"], correct: "Léonard de Vinci" }, date: { question: "Date (Année) :", options: ["1485", "1503", "1540"], correct: "1503" }, taille: { question: "Taille (arrondi au cm) :", options: ["45 x 35 cm", "77 x 53 cm", "120 x 90 cm"], correct: "77 x 53 cm" }, technique: { question: "Technique :", options: ["Huile sur panneau de peuplier", "Huile sur toile", "Détrempe sur bois"], correct: "Huile sur panneau de peuplier" } },
            { title: "La Ronde de nuit", image: "la-ronde-de-nuit.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Frans Hals", "Rembrandt", "Johannes Vermeer"], correct: "Rembrandt" }, date: { question: "Date (Année) :", options: ["1610", "1675", "1642"], correct: "1642" }, taille: { question: "Taille (arrondi au cm) :", options: ["379 x 454 cm", "250 x 300 cm", "150 x 200 cm"], correct: "379 x 454 cm" }, technique: { question: "Technique :", options: ["Huile sur toile", "Technique mixte", "Huile sur bois"], correct: "Huile sur toile" } },
            { title: "La Jeune Fille à la perle", image: "la-jeune-fille-a-la-perle.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Johannes Vermeer", "Pieter de Hooch", "Rembrandt"], correct: "Johannes Vermeer" }, date: { question: "Date (Année) :", options: ["1690", "1630", "1665"], correct: "1665" }, taille: { question: "Taille (arrondi au cm) :", options: ["45 x 40 cm", "70 x 60 cm", "30 x 25 cm"], correct: "45 x 40 cm" }, technique: { question: "Technique :", options: ["Aquarelle", "Huile sur toile", "Huile sur panneau"], correct: "Huile sur toile" } },
            { title: "La Grande Vague de Kanagawa", image: "la-grande-vague-de-kanagawa.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Utagawa Hiroshige", "Toshusai Sharaku", "Katsushika Hokusai"], correct: "Katsushika Hokusai" }, date: { question: "Date (Année) :", options: ["1795", "1831", "1865"], correct: "1831" }, taille: { question: "Taille (arrondi au cm) :", options: ["50 x 70 cm", "26 x 38 cm", "15 x 20 cm"], correct: "26 x 38 cm" }, technique: { question: "Technique :", options: ["Huile sur toile", "Estampe (gravure sur bois, ukiyo-e)", "Peinture à l'encre sur soie"], correct: "Estampe (gravure sur bois, ukiyo-e)" } },
            { title: "Impression, soleil levant", image: "impression-soleil-levant.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Claude Monet", "Camille Pissarro", "Pierre-Auguste Renoir"], correct: "Claude Monet" }, date: { question: "Date (Année) :", options: ["1885", "1860", "1872"], correct: "1872" }, taille: { question: "Taille (arrondi au cm) :", options: ["100 x 120 cm", "48 x 63 cm", "30 x 40 cm"], correct: "48 x 63 cm" }, technique: { question: "Technique :", options: ["Acrylique sur toile", "Pastel sur papier", "Huile sur toile"], correct: "Huile sur toile" } },
            { title: "Le Penseur", image: "le-penseur.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Auguste Rodin", "Antoine Bourdelle", "Camille Claudel"], correct: "Auguste Rodin" }, date: { question: "Date (Année) :", options: ["1925", "1880", "1904"], correct: "1904" }, taille: { question: "Taille (arrondi au cm) :", options: ["80 x 40 x 50 cm", "300 x 150 x 200 cm", "189 x 98 x 140 cm"], correct: "189 x 98 x 140 cm" }, technique: { question: "Technique :", options: ["Sculpture en marbre", "Taille directe sur pierre", "Sculpture en bronze"], correct: "Sculpture en bronze" } },
            { title: "La Nuit étoilée", image: "la-nuit-etoilee.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Edvard Munch", "Vincent van Gogh", "Paul Gauguin"], correct: "Vincent van Gogh" }, date: { question: "Date (Année) :", options: ["1878", "1889", "1901"], correct: "1889" }, taille: { question: "Taille (arrondi au cm) :", options: ["50 x 60 cm", "120 x 150 cm", "74 x 92 cm"], correct: "74 x 92 cm" }, technique: { question: "Technique :", options: ["Gouache sur papier", "Huile sur panneau", "Huile sur toile"], correct: "Huile sur toile" } },
            { title: "Le Cri", image: "le-cri.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Edvard Munch", "Gustav Klimt", "Egon Schiele"], correct: "Edvard Munch" }, date: { question: "Date (Année) :", options: ["1880", "1893", "1905"], correct: "1893" }, taille: { question: "Taille (arrondi au cm) :", options: ["150 x 120 cm", "91 x 74 cm", "50 x 40 cm"], correct: "91 x 74 cm" }, technique: { question: "Technique :", options: ["Huile, tempera et pastel sur carton", "Huile sur toile", "Gravure sur bois"], correct: "Huile, tempera et pastel sur carton" } },
            { title: "American Gothic", image: "american-gothic.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Georgia O'Keeffe", "Edward Hopper", "Grant Wood"], correct: "Grant Wood" }, date: { question: "Date (Année) :", options: ["1930", "1915", "1945"], correct: "1930" }, taille: { question: "Taille (arrondi au cm) :", options: ["110 x 90 cm", "50 x 40 cm", "78 x 65 cm"], correct: "78 x 65 cm" }, technique: { question: "Technique :", options: ["Huile sur panneau de beaverboard", "Acrylique sur toile", "Huile sur toile"], correct: "Huile sur panneau de beaverboard" } },
            { title: "La Persistance de la mémoire", image: "la-persistance-de-la-memoire.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["René Magritte", "Max Ernst", "Salvador Dalí"], correct: "Salvador Dalí" }, date: { question: "Date (Année) :", options: ["1931", "1924", "1940"], correct: "1931" }, taille: { question: "Taille (arrondi au cm) :", options: ["60 x 80 cm", "100 x 120 cm", "24 x 33 cm"], correct: "24 x 33 cm" }, technique: { question: "Technique :", options: ["Huile sur toile", "Huile sur panneau de bois", "Gouache sur papier"], correct: "Huile sur toile" } },
            { title: "Guernica", image: "guernica.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Salvador Dalí", "Joan Miró", "Pablo Picasso"], correct: "Pablo Picasso" }, date: { question: "Date (Année) :", options: ["1920", "1950", "1937"], correct: "1937" }, taille: { question: "Taille (arrondi au cm) :", options: ["349 x 776 cm", "150 x 300 cm", "200 x 400 cm"], correct: "349 x 776 cm" }, technique: { question: "Technique :", options: ["Acrylique et techniques mixtes", "Fresque murale", "Huile sur toile"], correct: "Huile sur toile" } },
            { title: "Nighthawks", image: "nighthawks.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Jackson Pollock", "Grant Wood", "Edward Hopper"], correct: "Edward Hopper" }, date: { question: "Date (Année) :", options: ["1928", "1942", "1955"], correct: "1942" }, taille: { question: "Taille (arrondi au cm) :", options: ["84 x 153 cm", "120 x 200 cm", "50 x 90 cm"], correct: "84 x 153 cm" }, technique: { question: "Technique :", options: ["Huile sur toile", "Huile sur panneau", "Acrylique sur toile"], correct: "Huile sur toile" } },
            { title: "Diptyque de Marilyn", image: "diptyque-de-marilyn.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Andy Warhol", "Roy Lichtenstein", "Keith Haring"], correct: "Andy Warhol" }, date: { question: "Date (Année) :", options: ["1975", "1962", "1950"], correct: "1962" }, taille: { question: "Taille (arrondi au cm) :", options: ["100 x 150 cm", "205 x 290 cm", "300 x 400 cm"], correct: "205 x 290 cm" }, technique: { question: "Technique :", options: ["Impression numérique", "Huile et acrylique", "Sérigraphie sur toile"], correct: "Sérigraphie sur toile" } },
            { title: "Le Fils de l'homme", image: "le-fils-de-l-homme.jpg", auteur: { question: "Auteur de l'œuvre :", options: ["Paul Delvaux", "René Magritte", "Salvador Dalí"], correct: "René Magritte" }, date: { question: "Date (Année) :", options: ["1964", "1971", "1952"], correct: "1964" }, taille: { question: "Taille (arrondi au cm) :", options: ["116 x 89 cm", "150 x 120 cm", "70 x 50 cm"], correct: "116 x 89 cm" }, technique: { question: "Technique :", options: ["Huile sur toile", "Huile sur panneau", "Gouache sur papier"], correct: "Huile sur toile" } }
        ];

        let selectedPlayerIndex = null;
        let selectedTileId = null;
        let gameData = { count: 5, colors: { 1: 'purple', 2: 'blue', 3: 'green', 4: 'red', 5: 'yellow' }, names: {}, difficulty: 'easy' };
        
        let playerVisitedColors = {};
        let currentActiveArtwork = null;
        let currentActiveCategoryKey = null;
        let hasAnsweredCurrentQuestion = false; // Verrou pour une seule tentative

        function initApp() {
            loadGameData();
            renderPlayers();
        }

        function loadGameData() {
            const stored = localStorage.getItem('bg_helper_game_players');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed && parsed.count) {
                        gameData = parsed;
                    }
                } catch (e) {
                    console.warn('Fallback to default setup');
                }
            }
        }

        function renderPlayers() {
            const container = document.getElementById('playersGrid');
            if (!container) return;
            container.innerHTML = '';

            const totalPlayers = gameData.count || 5;

            for (let i = 1; i <= totalPlayers; i++) {
                const colorId = (gameData.colors && gameData.colors[i]) || COLOR_OPTIONS[(i - 1) % COLOR_OPTIONS.length].id;
                const colorObj = COLOR_OPTIONS.find(c => c.id === colorId) || COLOR_OPTIONS[0];
                const playerName = (gameData.names && gameData.names[i]) ? gameData.names[i] : `Joueur ${i}`;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `player-card-${i}`;
                btn.onclick = () => selectPlayer(i, colorObj, playerName);
                btn.className = `player-btn flex-1 min-w-0 flex flex-col items-center justify-center p-1.5 sm:p-2 rounded-xl border-2 border-[#417E94] bg-[#2D5766] hover:bg-[#417E94]/40 transition text-center cursor-pointer shadow-md group`;

                btn.innerHTML = `
                    <div class="w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center relative my-0.5">
                        <img src="assets/${colorObj.sprite}" alt="${colorObj.name}" class="w-full h-full object-contain drop-shadow" onerror="handleSpriteError(this)">
                        <div class="fallback-cross hidden absolute inset-0 items-center justify-center text-rose-500">
                            <i class="fa-solid fa-xmark text-sm sm:text-base"></i>
                        </div>
                    </div>
                    <span class="text-[11px] sm:text-xs font-extrabold text-white group-hover:text-[#65C3E6] truncate w-full">${playerName}</span>
                    <span class="text-[9px] sm:text-[10px] font-semibold px-1.5 sm:px-2 py-0.5 rounded-full ${colorObj.bgClass} text-white shadow-sm mt-0.5 truncate max-w-full">${colorObj.name}</span>
                `;

                container.appendChild(btn);
            }
        }

        function selectPlayer(index, colorObj, playerName) {
            selectedPlayerIndex = index;
            selectedTileId = null;

            document.querySelectorAll('.player-btn').forEach((btn, idx) => {
                if (idx + 1 === index) {
                    btn.classList.remove('border-[#417E94]', 'bg-[#2D5766]');
                    btn.classList.add('border-[#65C3E6]', 'bg-[#417E94]/80', 'ring-2', 'ring-[#65C3E6]/50');
                } else {
                    btn.classList.remove('border-[#65C3E6]', 'bg-[#417E94]/80', 'ring-2', 'ring-[#65C3E6]/50');
                    btn.classList.add('border-[#417E94]', 'bg-[#2D5766]');
                }
            });

            const label = document.getElementById('selectedPlayerLabel');
            if (label) {
                label.textContent = `${playerName} (${colorObj.name})`;
            }

            const caseSection = document.getElementById('quelleCaseSection');
            if (caseSection) {
                caseSection.classList.remove('hidden');
                caseSection.classList.add('flex');
            }

            const actionPanel = document.getElementById('actionPanel');
            if (actionPanel) actionPanel.classList.add('hidden');

            const questionContainer = document.getElementById('questionContainer');
            if (questionContainer) questionContainer.classList.add('hidden');

            const multicolorNotice = document.getElementById('multicolorNotice');
            if (multicolorNotice) multicolorNotice.classList.add('hidden');

            renderTiles();
        }

        function renderTiles() {
            const container = document.getElementById('tilesGrid');
            if (!container) return;
            container.innerHTML = '';

            const allTiles = [...COLOR_OPTIONS, MULTICOLOR_TILE];
            const visitedSet = (playerVisitedColors[selectedPlayerIndex]) || new Set();

            allTiles.forEach(tile => {
                const isBlocked = !tile.isMulticolor && visitedSet.has(tile.id);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `tile-btn-${tile.id}`;
                
                if (isBlocked) {
                    btn.disabled = true;
                    btn.className = `tile-btn flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-600 bg-slate-800/50 text-slate-400 opacity-60 cursor-not-allowed text-left w-full`;
                } else {
                    btn.onclick = () => selectTile(tile);
                    btn.className = `tile-btn flex items-center gap-2.5 p-2.5 rounded-xl border border-white/20 ${tile.bgClass} text-white shadow-md transition cursor-pointer text-left w-full hover:brightness-110`;
                }

                let iconMarkup = '';
                if (tile.isMulticolor) {
                    iconMarkup = `
                        <div class="w-6 h-6 shrink-0 relative rounded overflow-hidden grid grid-cols-2 grid-rows-2 border border-white/30 shadow-sm">
                            <div class="bg-blue-500"></div>
                            <div class="bg-amber-400"></div>
                            <div class="bg-red-500"></div>
                            <div class="bg-emerald-500"></div>
                            <div class="absolute inset-[18%] bg-purple-600 rounded-sm shadow border border-white/40"></div>
                        </div>
                    `;
                } else {
                    iconMarkup = `
                        <div class="w-6 h-6 shrink-0 flex items-center justify-center bg-black/20 rounded-lg text-white">
                            <i class="fa-solid ${tile.icon} text-xs"></i>
                        </div>
                    `;
                }

                btn.innerHTML = `
                    ${iconMarkup}
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-bold leading-tight truncate">${tile.name} ${isBlocked ? '(Deja fait)' : ''}</div>
                        <div class="text-[10px] font-medium uppercase tracking-wider opacity-90 truncate">${tile.category}</div>
                    </div>
                    <i class="fa-solid ${isBlocked ? 'fa-lock' : 'fa-circle-check opacity-0 check-tile-icon'} text-xs shrink-0"></i>
                `;

                container.appendChild(btn);
            });
        }

        function selectTile(tile) {
            selectedTileId = tile.id;

            document.querySelectorAll('.tile-btn').forEach(btn => {
                const icon = btn.querySelector('.check-tile-icon');
                if (btn.id === `tile-btn-${tile.id}`) {
                    btn.classList.add('ring-2', 'ring-white', 'shadow-lg');
                    if (icon) icon.classList.remove('opacity-0');
                } else {
                    btn.classList.remove('ring-2', 'ring-white', 'shadow-lg');
                    if (icon) icon.classList.add('opacity-0');
                }
            });

            const playerName = (gameData.names && gameData.names[selectedPlayerIndex]) ? gameData.names[selectedPlayerIndex] : `Joueur ${selectedPlayerIndex}`;

            const multicolorNotice = document.getElementById('multicolorNotice');
            const questionContainer = document.getElementById('questionContainer');

            if (tile.id === 'multicolor') {
                if (multicolorNotice) {
                    multicolorNotice.textContent = `${playerName} peut réviser jusqu'à son prochain tour !`;
                    multicolorNotice.classList.remove('hidden');
                }
                if (questionContainer) questionContainer.classList.add('hidden');
            } else {
                if (multicolorNotice) multicolorNotice.classList.add('hidden');
                generateQuestionForTile(tile);
            }

            const actionPanel = document.getElementById('actionPanel');
            const summaryText = document.getElementById('actionSummaryText');

            if (actionPanel && summaryText) {
                summaryText.innerHTML = `${playerName} sur case <span class="font-bold underline">${tile.name}</span> (${tile.category})`;
                actionPanel.classList.remove('hidden');
                actionPanel.classList.add('flex');
            }
        }

        function generateQuestionForTile(tile) {
            currentActiveCategoryKey = tile.category;
            hasAnsweredCurrentQuestion = false; // Réinitialiser le verrou de tentative unique
            
            // Pioche aléatoire d'une œuvre parmi toutes les 15 œuvres
            const randomIndex = Math.floor(Math.random() * ARTWORKS_DB.length);
            currentActiveArtwork = ARTWORKS_DB[randomIndex];

            const questionContainer = document.getElementById('questionContainer');
            if (!questionContainer) return;

            questionContainer.classList.remove('hidden');
            questionContainer.classList.add('flex');

            const titleEl = document.getElementById('artworkTitleDisplay');
            const imgEl = document.getElementById('artworkImgDisplay');
            const qTextEl = document.getElementById('questionTextDisplay');
            const optionsArea = document.getElementById('easyOptionsArea');
            const hardArea = document.getElementById('hardInputArea');
            const feedbackEl = document.getElementById('questionFeedback');

            if (feedbackEl) {
                feedbackEl.innerHTML = '';
                feedbackEl.className = 'hidden';
            }

            if (imgEl) {
                imgEl.src = `assets/${currentActiveArtwork.image}`;
                imgEl.alt = currentActiveArtwork.title;
            }

            if (titleEl) {
                if (currentActiveCategoryKey === 'titre') {
                    titleEl.innerHTML = `<span class="italic text-emerald-300">Œuvre mystère (Devinez le titre)</span>`;
                } else {
                    titleEl.innerHTML = `Œuvre : <span class="font-bold text-amber-200">${currentActiveArtwork.title}</span>`;
                }
            }

            const currentDifficulty = gameData.difficulty || 'easy';

            if (currentDifficulty === 'easy') {
                if (hardArea) hardArea.classList.add('hidden');
                if (optionsArea) {
                    optionsArea.classList.remove('hidden');
                    optionsArea.innerHTML = '';

                    let qObj;
                    if (currentActiveCategoryKey === 'titre') {
                        const otherTitles = ARTWORKS_DB.filter(a => a.title !== currentActiveArtwork.title).map(a => a.title);
                        otherTitles.sort(() => Math.random() - 0.5);
                        let choices = [currentActiveArtwork.title, otherTitles[0], otherTitles[1]];
                        choices.sort(() => Math.random() - 0.5); // Ordre aléatoire pour le facile
                        qObj = { question: "Quel est le titre de cette œuvre ?", options: choices, correct: currentActiveArtwork.title };
                    } else {
                        qObj = currentActiveArtwork[currentActiveCategoryKey];
                    }

                    if (qTextEl) qTextEl.textContent = qObj.question;

                    // Ordre aléatoire garanti pour les options QCM en mode facile
                    let randomizedOptions = [...qObj.options];
                    randomizedOptions.sort(() => Math.random() - 0.5);

                    randomizedOptions.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.type = 'button';
                        optBtn.className = 'option-btn w-full text-left p-2.5 rounded-xl bg-[#1D3842] hover:bg-[#417E94] border border-[#417E94] text-xs font-semibold text-white transition shadow-sm';
                        optBtn.textContent = opt;
                        optBtn.onclick = () => checkEasyAnswer(opt, qObj.correct, optBtn);
                        optionsArea.appendChild(optBtn);
                    });
                }
            } else {
                // HARD DIFFICULTY (Prend une œuvre au hasard dans la DB, et pose la question correspondante dans un ordre aléatoire)
                if (optionsArea) optionsArea.classList.add('hidden');
                if (hardArea) {
                    hardArea.classList.remove('hidden');
                    let qObj;
                    if (currentActiveCategoryKey === 'titre') {
                        qObj = { question: "Quel est le titre de cette œuvre ?", correct: currentActiveArtwork.title };
                    } else {
                        qObj = currentActiveArtwork[currentActiveCategoryKey];
                    }
                    if (qTextEl) qTextEl.textContent = qObj.question;

                    const inputField = document.getElementById('hardAnswerInput');
                    const submitBtn = document.getElementById('hardSubmitBtn');
                    if (inputField) {
                        inputField.value = '';
                        inputField.disabled = false;
                    }
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            }
        }

        function checkEasyAnswer(selectedOption, correctOption, clickedBtn) {
            if (hasAnsweredCurrentQuestion) return; // Bloqué si déjà répondu
            hasAnsweredCurrentQuestion = true;

            // Désactiver tous les boutons de choix pour empêcher une autre tentative
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            });

            const feedbackEl = document.getElementById('questionFeedback');
            if (!feedbackEl) return;

            feedbackEl.classList.remove('hidden');

            if (selectedOption === correctOption) {
                markColorAsVisited(selectedPlayerIndex, selectedTileId);

                feedbackEl.className = 'p-3 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-200 text-xs font-bold text-center';
                feedbackEl.innerHTML = `
                    <div class="text-sm mb-1"><i class="fa-solid fa-circle-check"><b> Bonne reponse !</b></i></div>
                    <div class="text-white text-sm font-extrabold bg-emerald-600/60 py-1.5 px-3 rounded-lg mt-1 tracking-wide shadow">Allez dans une autre couleur</div>
                `;
            } else {
                // Mauvaise réponse : bloqué jusqu'à ce qu'il aille sur une autre couleur
                feedbackEl.className = 'p-3 rounded-xl bg-rose-500/20 border border-rose-500 text-rose-200 text-xs font-semibold text-center';
                feedbackEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Mauvaise reponse (1 essai maximum). La bonne reponse etait : <span class="font-bold text-white">${correctOption}</span><div class="mt-2 text-amber-300 font-bold">Veuillez aller sur une autre couleur !</div>`;
            }
        }

        function submitHardAnswer() {
            if (hasAnsweredCurrentQuestion) return; // Bloqué si déjà répondu

            const inputField = document.getElementById('hardAnswerInput');
            const submitBtn = document.getElementById('hardSubmitBtn');
            if (!inputField) return;

            const userVal = inputField.value.trim();
            if (!userVal) return;

            hasAnsweredCurrentQuestion = true;
            inputField.disabled = true;
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            let correctVal = '';
            if (currentActiveCategoryKey === 'titre') {
                correctVal = currentActiveArtwork.title;
            } else {
                correctVal = currentActiveArtwork[currentActiveCategoryKey].correct;
            }

            const isCorrect = compareAnswersFlexible(userVal, correctVal);
            const feedbackEl = document.getElementById('questionFeedback');
            if (!feedbackEl) return;

            feedbackEl.classList.remove('hidden');

            if (isCorrect) {
                markColorAsVisited(selectedPlayerIndex, selectedTileId);

                feedbackEl.className = 'p-3 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-200 text-xs font-bold text-center';
                feedbackEl.innerHTML = `
                    <div class="text-sm mb-1"><i class="fa-solid fa-circle-check"><b> Bonne reponse !</b></i></div>
                    <div class="text-white text-sm font-extrabold bg-emerald-600/60 py-1.5 px-3 rounded-lg mt-1 tracking-wide shadow">Allez dans une autre couleur</div>
                `;
            } else {
                // Mauvaise réponse : bloqué
                feedbackEl.className = 'p-3 rounded-xl bg-rose-500/20 border border-rose-500 text-rose-200 text-xs font-semibold text-center';
                feedbackEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Mauvaise reponse (1 essai maximum). La reponse exacte attendue etait : <span class="font-bold text-white">${correctVal}</span><div class="mt-2 text-amber-300 font-bold">Veuillez aller sur une autre couleur !</div>`;
            }
        }

        function compareAnswersFlexible(userStr, correctStr) {
            const normalize = (str) => {
                return str.toLowerCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9]/g, "");
            };

            const normUser = normalize(userStr);
            const normCorrect = normalize(correctStr);

            if (normUser === normCorrect) return true;
            if (normUser.length >= 3 && normCorrect.includes(normUser)) return true;

            const distance = levenshteinDistance(normUser, normCorrect);
            const tolerance = Math.max(1, Math.floor(normCorrect.length * 0.25));
            return distance <= tolerance;
        }

        function levenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function markColorAsVisited(playerIdx, tileId) {
            if (!playerVisitedColors[playerIdx]) {
                playerVisitedColors[playerIdx] = new Set();
            }
            playerVisitedColors[playerIdx].add(tileId);
            renderTiles();
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</head>
<body class="min-h-full h-auto bg-[#1D3842] text-slate-100 flex flex-col items-center justify-start p-2 sm:p-4 max-w-xl mx-auto overflow-y-auto">

    <!-- MAIN CONTAINER -->
    <main class="w-full flex flex-col gap-3 pb-4">

        <!-- ==================== SECTION 1: 5 PLAYERS SELECTION ==================== -->
        <section id="playersSection" class="bg-[#2D5766] border border-[#417E94] rounded-2xl p-2.5 sm:p-3 shadow-xl">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-users text-[#65C3E6]"></i> Sélectionner un joueur
                </h2>
                <span class="text-[10px] text-slate-300">Cliquez pour choisir</span>
            </div>

            <!-- Player cards grid (5 players max) -->
            <div id="playersGrid" class="grid grid-cols-5 gap-1 sm:gap-1.5 w-full">
                <!-- Dynamically populated by JS -->
            </div>
        </section>

        <!-- ==================== SECTION 2: QUELLE CASE ? ==================== -->
        <section id="quelleCaseSection" class="hidden bg-[#2D5766] border border-[#417E94] rounded-2xl p-3 shadow-xl flex-col gap-2.5">
            <div class="flex items-center justify-between border-b border-[#417E94]/60 pb-2">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#65C3E6] animate-ping"></div>
                    <h3 class="text-sm font-extrabold text-white">Quelle case ?</h3>
                </div>
                <span id="selectedPlayerLabel" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-[#1D3842] text-[#65C3E6] border border-[#417E94] truncate max-w-[160px] sm:max-w-xs">
                    Joueur sélectionné
                </span>
            </div>

            <!-- 6 Tile categories grid (3x2 responsive) -->
            <div id="tilesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <!-- Dynamically populated by JS -->
            </div>

            <!-- Multicouleur Revision Notice -->
            <div id="multicolorNotice" class="hidden text-amber-200 text-xs font-semibold text-center py-2 px-3 bg-amber-500/20 border border-amber-400/40 rounded-xl">
                <!-- Populated dynamically when Multicouleur is clicked -->
            </div>

            <!-- Action summary panel -->
            <div id="actionPanel" class="hidden flex-col gap-2 pt-1 border-t border-[#417E94]/60">
                <div class="flex items-center justify-between gap-2">
                    <span id="actionSummaryText" class="text-xs text-slate-200 truncate"></span>
                </div>
            </div>

            <!-- ==================== SECTION 3: QUESTIONNAIRE ARTISTIQUE ==================== -->
            <div id="questionContainer" class="hidden flex-col gap-2.5 bg-[#1D3842] border border-[#417E94] rounded-xl p-3 shadow-inner">
                <div class="flex items-center justify-between">
                    <span id="artworkTitleDisplay" class="text-xs font-bold text-amber-300"></span>
                    <span class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 bg-[#2D5766] px-2 py-0.5 rounded border border-[#417E94]">Défi Art</span>
                </div>

                <!-- Artwork Image Display from assets folder (.jpg) -->
                <div class="w-full h-40 sm:h-48 bg-black/30 rounded-lg overflow-hidden flex items-center justify-center border border-[#417E94]/50">
                    <img id="artworkImgDisplay" src="" alt="Œuvre d'art" class="w-full h-full object-contain">
                </div>

                <div id="questionTextDisplay" class="text-xs font-semibold text-white leading-relaxed"></div>

                <!-- Easy Mode (3 Options QCM, randomized order) -->
                <div id="easyOptionsArea" class="flex flex-col gap-1.5 hidden">
                    <!-- Populated dynamically -->
                </div>

                <!-- Hard Mode (Text Input with fuzzy tolerance, random artworks) -->
                <div id="hardInputArea" class="flex flex-col gap-2 hidden">
                    <div class="flex gap-2">
                        <input type="text" id="hardAnswerInput" placeholder="Écrivez votre réponse..." class="flex-1 bg-[#2D5766] border border-[#417E94] rounded-xl px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#65C3E6]">
                        <button type="button" id="hardSubmitBtn" onclick="submitHardAnswer()" class="bg-[#65C3E6] hover:bg-[#417E94] text-[#1D3842] hover:text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow">Valider</button>
                    </div>
                </div>

                <!-- Feedback & Success Message -->
                <div id="questionFeedback" class="hidden"></div>
            </div>

        </section>

    </main>

</body>
</html>
